name: Desafio Seldon CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static analysis and JVM tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DesafioSeldon
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.4"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Static analysis (Android Lint)
        run: ./gradlew lint

      - name: Unit tests (JVM, no emulator)
        run: ./gradlew test
